name: Threads 自動投稿
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "due=予定時刻を過ぎた分を投稿 / next=次の1件を今すぐ投稿"
        default: "due"
        type: choice
        options: [due, next]
permissions:
  contents: write
concurrency:
  group: threads-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 投稿する（テキスト・転職ノート）
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ACCOUNT_DIR: tenshoku
          MODE: ${{ github.event.inputs.mode || 'due' }}
        run: python post_tree.py
      - name: 投稿記録を保存
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tenshoku
          git diff --cached --quiet || (git commit -m "posted" && git pull --rebase && git push)
